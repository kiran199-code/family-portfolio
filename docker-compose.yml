services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/portfolio
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ENABLE_UNOFFICIAL_YAHOO: ${ENABLE_UNOFFICIAL_YAHOO:-false}
      TZ: Asia/Kolkata
volumes: { pgdata: {} }
